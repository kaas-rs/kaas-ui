[workspace]
resolver = "3"
members = [
    "xtask",
    "crates/kaas-ui-auth",
    "crates/kaas-ui-serde",
    "crates/kaas-ui-core",
    "crates/kaas-ui-api",
    "crates/kaas-ui-server",
]

[workspace.package]
version      = "0.12.2"
edition      = "2024"
license      = "Apache-2.0"
repository   = "https://github.com/kaas-rs/kaas-ui"
rust-version = "1.97"

[workspace.dependencies]
# kaas-ui's only Kafka dependency, from crates.io. The four release in
# lockstep and must be pulled at the same version — see docs/00-foundations.md.
# `cargo xtask link` writes a fenced [patch.crates-io] block for local
# iteration against ../kaas-lib; `cargo xtask ci` fails if that fence was
# committed.
kafka-admin = "0.9"
# `oidc` is what makes SASL/OAUTHBEARER usable from a config file: it brings
# the `client_credentials` token provider that fetches a token and refreshes
# it. Without the feature the mechanism exists but only a hand-written
# `TokenProvider` can reach it, which a YAML block cannot be.
kafka-conn  = { version = "0.9", features = ["oidc"] }
kafka-meta  = "0.9"
kafka-read  = "0.9"

# HTTP
axum       = { version = "0.8", features = ["macros", "http2"] }
axum-extra = { version = "0.10", features = ["cookie-private"] }
# The cookie crate's clock type, for Max-Age. Already in the tree beneath it.
time       = { version = "0.3", default-features = false }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
tower      = "0.5"

# OIDC. `rustls-tls` rather than native: the image is distroless and carries no
# OpenSSL, and rustls is already in the tree for the broker connections.
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "set-header"] }
utoipa     = { version = "5.5", features = ["axum_extras"] }

# async + runtime
tokio        = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
futures      = "0.3"
async-stream = "0.3"
arc-swap     = "1.9"

# config, serialisation, errors, logging
figment            = { version = "0.10", features = ["yaml", "env"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
humantime-serde    = "1"
thiserror          = "2.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap               = { version = "4.5", features = ["derive", "env"] }

# assets
rust-embed = "8.12"
mime_guess = "2"
bytes      = "1.12"

# payload decoding. One library resolves schema ids and decodes all three
# registry-backed formats, because all three are the same Confluent wire
# format — see docs/11-built.md, "Phase 6 — the decisions".
#
# **No TLS feature here, deliberately.** Both of the converter's are wrong for
# this build: `native_tls` wants OpenSSL, which the distroless image has none
# of, and `rustls_tls` maps to `reqwest/rustls`, which forces `aws-lc-rs` and
# turns the two-line musl builder in the Dockerfile into a cmake project. TLS
# comes from the `reqwest` features below instead, on the one copy of reqwest
# the whole graph shares.
schema_registry_converter = { version = "4.10", default-features = false, features = [
    "futures",
    "avro",
    "json",
    "proto_decoder",
] }
# The value types the three decoders hand back. Pulled in beside the converter
# rather than instead of it: converting them to JSON is ours, decoding is not.
apache-avro = { version = "0.21", default-features = false }
protofish   = "0.5"
# The schema browser's own calls — subjects, versions, compatibility — which
# the converter's API does not cover. Pinned to the major the converter
# already brings so the tree carries one copy of it rather than two, and it is
# where TLS is turned on for both.
#
# `rustls-no-provider` rather than `rustls`: the latter pulls `aws-lc-rs`, and
# the rest of this workspace is already on `ring` through kaas-lib. "No
# provider" means kaas-ui-serde installs one — see `RegistryHandle::new` — so
# the crate that needs TLS is the crate that arranges for it, rather than
# `main` having to remember on its behalf.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Only to install that provider, once, behind a `Once`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# internal
kaas-ui-auth  = { path = "crates/kaas-ui-auth" }
kaas-ui-serde = { path = "crates/kaas-ui-serde" }
kaas-ui-core  = { path = "crates/kaas-ui-core" }
kaas-ui-api   = { path = "crates/kaas-ui-api" }

[workspace.lints.clippy]
unwrap_used              = "deny"
expect_used              = "deny"
panic                    = "deny"
indexing_slicing         = "deny"
as_conversions           = "deny"
cast_possible_truncation = "deny"
cast_sign_loss           = "deny"

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_debug_implementations = "warn"

[profile.release]
# A read-only UI binary: size and a clean backtrace matter more than the last
# few percent of throughput, and LTO is what gets the distroless image near
# the number PLAN.md §10 claims.
lto           = "thin"
codegen-units = 1
strip         = true

