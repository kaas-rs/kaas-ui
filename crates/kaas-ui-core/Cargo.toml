[package]
name        = "kaas-ui-core"
description = "Configuration, cluster registry and domain types for kaas-ui."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
kaas-ui-auth  = { workspace = true }
kaas-ui-serde = { workspace = true }

kafka-admin = { workspace = true }
kafka-conn  = { workspace = true }
kafka-meta  = { workspace = true }
kafka-read  = { workspace = true }

arc-swap        = { workspace = true }
figment         = { workspace = true }
humantime-serde = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }
utoipa          = { workspace = true }

[dev-dependencies]
# The record fixtures the payload tests are built from.
bytes = { workspace = true }
# `Jail` isolates environment variables and the working directory, which is the
# only honest way to test an overlay that reads the real environment.
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
