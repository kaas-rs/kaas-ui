[package]
name        = "kaas-ui-serde"
description = "Payload decoding for kaas-ui: the Confluent framing, the registry client, and the codecs behind them."

version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
schema_registry_converter = { workspace = true }
apache-avro               = { workspace = true }
protofish                 = { workspace = true }
reqwest                   = { workspace = true }
rustls                    = { workspace = true }
# A registry with an `oauth` block: the token is asked of a provider on every
# call, through a middleware on the converter's client. `kafka-conn` for the
# `TokenProvider` trait alone — the same one a cluster's OAUTHBEARER takes, so
# one provider type serves both and kaas-ui-core builds it once.
async-trait               = { workspace = true }
http                      = { workspace = true }
kafka-conn                = { workspace = true }
reqwest-middleware        = { workspace = true }

arc-swap        = { workspace = true }
humantime-serde = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }
utoipa          = { workspace = true }

[dev-dependencies]
# The stub registry the tests point at. A handful of `TcpStream`s and a
# hand-written response is enough to count requests, which is the one thing
# a mock library would not have given us.
tokio = { workspace = true }

[lints]
workspace = true
