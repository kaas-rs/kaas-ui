# Advisories accepted after reading them against what kaas-ui actually does.
# `cargo audit` reads this file on its own. Each entry says why the advisory
# cannot reach this process and what should send someone back to it; an entry
# whose reason stops being true is a finding, not a line to keep.
#
# The one left arrives only through `openidconnect` 4.1.0, which kaas-ui-auth
# uses for a code flow (PKCE, nonce, client secret) and for checking ID-token
# signatures against the issuer's JWKS. That is public-key verification on
# public inputs. No RSA private key exists in this process: the federated
# credential for the schema registries is a JWT SPIRE writes to a file, not
# one kaas-ui signs. Tracked in kaas-rs/kaas-ui#8, which stays open until it
# is gone.
#
# Replacing `openidconnect` to drop it was considered and rejected: it is
# maintained (slowly — one maintainer), and the alternative is hand-written
# ID-token validation, a worse trade than an advisory nothing here can
# trigger.

[advisories]
ignore = [
    # rsa 0.9.10 — Marvin: timing in RSA *private-key* operations (decrypt,
    # sign) can leak the key. kaas-ui only verifies RS256 signatures with the
    # issuer's public key, so there is no key to leak. The fix is rsa 0.10.0,
    # which is stable, but openidconnect 4.1.0 still requires `^0.9.2`; the
    # move is ramosbugs/openidconnect-rs#244, open, and waiting on
    # ramosbugs/oauth2-rs#352. Revisit when an openidconnect release takes
    # rsa 0.10.
    "RUSTSEC-2023-0071",
]
