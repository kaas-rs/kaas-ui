# Version updates for the three things this repo pins, each as one grouped
# PR a month, after a week's cooldown — a release that is a day old has had a
# day to be noticed if it is bad. Commit messages come out conventional:
# `ci(deps): …` for actions, `chore(deps): …` for the rest.
#
# Dependabot PRs run CI on GitHub-hosted runners, never on ARC: they are this
# repo's own branches, so the fork test does not catch them, and their diff is
# code nobody has read yet. See the routing comment at the top of ci.yml.
#
# Pins Dependabot cannot see, bumped by hand: `dtolnay/rust-toolchain` (no
# release tags — the `# master` comment is a branch) and the cargo-audit
# binary ci.yml downloads by URL.
#
# Security alerts, and the security-fix PRs they trigger, are separate from
# this file: they need the dependency graph working in the repo settings.

version: 2
updates:
  # Every action is pinned to a full commit SHA with its version as a comment;
  # Dependabot moves the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  # The lockfile is what ships in the image, so it is worth keeping current.
  # The four kaas-lib crates release in lockstep and must move together; the
  # first group takes them, the second everything else.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      kaas-lib:
        patterns: ["kafka-admin", "kafka-conn", "kafka-meta", "kafka-read"]
      rust:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  # The frontend. npm moves fast enough that per-package PRs would be noise.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
