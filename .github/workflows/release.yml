name: Release

# Builds and publishes the container image to ghcr.io/kaas-rs/kaas-ui.
#
# Unlike kaas-lib's release, this one is reversible — a container tag can be
# overwritten and a bad one simply never gets referenced by the GitOps repo.
# So it runs on every push to main (as `main` / `sha-<short>`) and on a
# version tag (as the semver ladder plus `latest`).
#
# `latest` only ever moves on a tag. An ArgoCD deployment pinned to `latest`
# and a `main` build clobbering it is how a cluster ends up running a commit
# nobody released.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kaas-rs/kaas-ui

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      buildable: ${{ steps.check.outputs.buildable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        env:
          ACTIONLINT_VERSION: v1.7.7
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint -color

      # Same gate as ci.yml: nothing to build until Phase 0 lands a workspace
      # and a Dockerfile. Remove this job once it has.
      - name: Is there anything to build yet?
        id: check
        run: |
          if [ -f Dockerfile ] && [ -f Cargo.toml ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Dockerfile/Cargo.toml yet — nothing to publish (Phase 0 creates them)"
          fi

  image:
    needs: preflight
    if: needs.preflight.outputs.buildable == 'true'
    runs-on: arc-runner-set-ui
    permissions:
      contents: read
      packages: write
      # cosign signs keylessly against the GitHub OIDC issuer.
      id-token: write
    steps:
      # The DinD sidecar is not ready the instant the runner container starts.
      - name: Wait for Docker daemon (DinD sidecar)
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon did not become ready"
          docker info || true
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # linux/amd64 only. The cluster is a single amd64 node, and
          # cross-building arm64 under QEMU on that same node would triple
          # the release time for nothing. Add arm64 when something needs it.
          #
          # The bare-major tag carries an `enable=` guard because
          # `metadata-action` does **not** special-case a zero major: it
          # emitted a plain `0` on every release from v0.4.0 through v0.8.1.
          # Its README has a "Major version zero" section saying the tag
          # *should not* be generated and giving exactly this expression to
          # stop it — a recommendation, not a behaviour, which is the reading
          # this project's release docs originally got wrong. `:0` would
          # mean "any 0.x", a compatibility promise 0.x does not make. The
          # guard lapses on its own at v1.0.0, so this is a condition rather
          # than a deleted line.
          #
          # Comments live out here, not inside the block below: `tags:` is a
          # literal scalar handed to the action verbatim, and `#` lines in it
          # are not documented as being stripped.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # cosign-installer v4 runs `envsubst` on its install-dir input,
      # unconditionally, and the ARC image (ghcr.io/actions/actions-runner) has
      # no gettext-base — v4.1.2's first run here failed with `envsubst:
      # command not found` after the image had already been pushed, so it went
      # out unsigned. Same shape as ci.yml's C toolchain step: a no-op where the
      # tool exists (ubuntu-latest), passwordless sudo where it does not.
      - name: Install envsubst (cosign-installer needs it)
        run: |
          if command -v envsubst >/dev/null 2>&1; then
            echo "envsubst already present: $(command -v envsubst)"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif command -v sudo >/dev/null 2>&1; then SUDO="sudo"
          else
            echo "::error::no envsubst, not root, and no sudo — cannot install cosign"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends gettext-base
          echo "envsubst → $(command -v envsubst || echo MISSING)"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # The design predicted ~25 MB and ~15 MB RSS against the JVM original's
      # several hundred. That is the project's headline claim, so it gets
      # measured on every release rather than asserted in a README.
      - name: Measure the image
        id: size
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull -q "${IMAGE}@${DIGEST}"
          bytes=$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{.Size}}')
          mb=$(( bytes / 1000000 ))
          echo "megabytes=${mb}" >> "$GITHUB_OUTPUT"
          echo "image size: ${mb} MB"

      - name: Summary
        if: always()
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MEGABYTES: ${{ steps.size.outputs.megabytes }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "\`\`\`"
            echo "${TAGS}"
            echo "\`\`\`"
            echo
            echo "- digest: \`${DIGEST}\`"
            echo "- size: **${MEGABYTES:-?} MB**"
            echo
            if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
              version="${GITHUB_REF#refs/tags/v}"
              echo "#### Deploy"
              echo
              echo "There is no ArgoCD Image Updater in this cluster; bump the tag by hand in"
              echo "\`Woestebanaan/k3s-cluster\`, \`apps/kaas-ui/kustomization.yaml\`:"
              echo
              echo "\`\`\`yaml"
              echo "images:"
              echo "  - name: ${IMAGE}"
              echo "    newTag: ${version}"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
