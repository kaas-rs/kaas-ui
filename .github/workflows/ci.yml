name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Self-hosted runners: `arc-runner-set-ui` is an ARC scale set on the kaas-rs
# k3s cluster (see Woestebanaan/k3s-cluster, apps/arc-runners). It is a third,
# repo-scoped set alongside `arc-runner-set` (kaas) and `arc-runner-set-lib`
# (kaas-lib) — the GitHub App has repo-level runner admin only, so org-scoping
# one set is not available to us. See that repo's 510bed4 / e4b8325.
#
# Jobs reachable from a *fork* pull request must NOT land there. The runner
# pods are privileged DinD with a hostPath mount onto the node, and this repo
# is public — a fork PR is arbitrary code from a stranger. So every job wired
# to `pull_request` picks its runner per event.
#
# Dependabot's pull requests go the same way. They are branches of this repo,
# so `fork` is false for them, but their diff is a dependency nobody has read
# yet, and a crate's build script runs during the build. The test is the PR's
# *author* rather than `github.actor`, which becomes whoever last pushed to or
# re-ran it.
#
# `github.event.pull_request` is null for push and dispatch, so those fall
# through to ARC.

jobs:
  # The workspace does not exist until Phase 0 lands (see docs/01-phase-0-*).
  # Without this gate, a docs-only push queues a job against a runner label
  # nothing answers to, and it sits pending rather than failing.
  #
  # Runs on a hosted runner because that is the one thing guaranteed to be
  # schedulable. Delete this job and the `needs`/`if` below once Phase 0 has
  # landed a Cargo.toml.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      workspace: ${{ steps.check.outputs.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before anything else, because it is seconds and catches a class of bug
      # nothing else here can. A workflow expression error is not a runtime
      # failure: GitHub creates the run, fails it in zero seconds with no jobs
      # and no logs, and `gh run view --log-failed` says only "log not found".
      # kaas-lib's release.yml carried one from the day it was written, so
      # every push produced a red run whose publish path had never executed.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: v1.7.7
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Is there a Rust workspace yet?
        id: check
        run: |
          if [ -f Cargo.toml ]; then
            echo "workspace=true" >> "$GITHUB_OUTPUT"
          else
            echo "workspace=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Cargo.toml yet — skipping build jobs (Phase 0 creates it)"
          fi

  # fmt + clippy + unit tests + the invariant greps + cargo audit. No Docker,
  # no broker — this is the gate that runs on every push. `cargo xtask ci`
  # also asserts the single `Admin::connect_read_only` call site, that no
  # Kafka version literal appears anywhere, and that no local kaas-lib path
  # override was committed.
  rust:
    needs: preflight
    if: needs.preflight.outputs.workspace == 'true'
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || 'arc-runner-set-ui' }}
    steps:
      # The ARC runner image (ghcr.io/actions/actions-runner) is minimal: no
      # cc, gcc, ld, make or pkg-config. `ring` and other build-script crates
      # need a working C toolchain and linker. curl/unzip/tar/git ARE present,
      # and uid 1001 is in group 27(sudo) with passwordless sudo.
      # No-ops on ubuntu-latest, which already has cc.
      - name: Install C toolchain
        run: |
          if command -v cc >/dev/null 2>&1; then
            echo "cc already present: $(command -v cc)"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ]; then SUDO=""
          elif command -v sudo >/dev/null 2>&1; then SUDO="sudo"
          else
            echo "::error::no cc, not root, and no sudo — cannot build native deps"
            exit 1
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends \
            gcc libc6-dev pkg-config ca-certificates
          echo "cc → $(command -v cc || echo MISSING)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (honours rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # `cargo xtask ci` ends with `cargo audit` and fails if the tool is
      # missing. Fetched as a pinned, checksummed release binary rather than
      # built or pulled through a third-party action: the audit is a
      # supply-chain control, so the less that executes to install it, the
      # less there is to trust. The musl build is static, so it runs on the
      # ARC image and on ubuntu-latest alike; $RUNNER_TEMP needs no sudo.
      # Bumping means BOTH lines below — the version, and the sha256 GitHub
      # lists for the -x86_64-unknown-linux-musl-<version>.tgz asset.
      - name: Install cargo-audit (pinned, checksummed)
        env:
          CARGO_AUDIT_VERSION: v0.22.2
          CARGO_AUDIT_SHA256: 7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
        run: |
          set -eu
          name="cargo-audit-x86_64-unknown-linux-musl-${CARGO_AUDIT_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/cargo-audit.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2F${CARGO_AUDIT_VERSION}/${name}.tgz"
          echo "${CARGO_AUDIT_SHA256}  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/${name}/cargo-audit" "$RUNNER_TEMP/bin/cargo-audit"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/cargo-audit" --version

      # `cargo xtask ci` renders the chart. The version is the one the cluster's
      # ArgoCD renders with, since that is the render that has to work, and
      # Dependabot cannot see it: bump it by hand when ArgoCD moves.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.1

      - name: cargo xtask ci
        run: cargo xtask ci

  # The frontend. Separate job so a Rust failure and a TypeScript failure are
  # distinguishable at a glance, and so the two run concurrently — they share
  # no inputs until the release build embeds one in the other.
  web:
    needs: preflight
    if: needs.preflight.outputs.workspace == 'true'
    runs-on: ${{ (github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]') && 'ubuntu-latest' || 'arc-runner-set-ui' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
