<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Through the bundler on purpose. Vite rewrites this to the
         fingerprinted `/assets/kaas-logo-<hash>.svg`, which is the one shape
         the server already knows how to move under a path prefix — see
         `rebase` in `crates/kaas-ui-server/src/assets.rs`. Left in
         `public/` instead it would sit at the bundle root, where absolute
         404s behind a proxy and relative resolves against the document, so a
         hard refresh on /clusters/kaas/topics/orders asks three levels down
         and gets the browser's default. -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/kaas-logo.svg" />
    <title>kaas-ui</title>
    <script>
      // Resolve the theme before first paint, so a dark-mode user never sees a
      // white flash. `data-theme` is always written, whether the choice was
      // stored or inferred, so the CSS has exactly one thing to look at — and
      // the `.dark` class alongside it, because that is what a copied-in
      // shadcn component expects.
      ;(function () {
        var stored = localStorage.getItem("kaas-ui-theme")
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light"
        )
        document.documentElement.classList.toggle("dark", dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
