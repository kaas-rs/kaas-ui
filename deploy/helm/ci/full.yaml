# Everything switched on at once, in the shape a signed-in deployment takes.
# `cargo xtask chart` feeds the rendered config.yaml through kaas-ui's own parser,
# so this file breaks the build the day it stops being a config the binary accepts.
commonLabels:
  app.kubernetes.io/part-of: example
podLabels:
  example.com/team: streaming
podAnnotations:
  example.com/scrape: "false"
serviceAccount:
  name: kaas-ui-sa
  labels:
    example.com/owner: streaming
  annotations:
    example.com/role: reader
service:
  annotations:
    example.com/internal: "true"
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: kaas-ui.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kaas-ui-tls
      hosts: [kaas-ui.example.com]
extraEnv:
  - name: RUST_LOG
    value: info
  - name: KAAS_UI_PASSWORD_DEV_KAFKA
    valueFrom:
      secretKeyRef:
        name: kafka-credentials
        key: password
extraEnvFrom:
  - secretRef:
      name: more-credentials
extraVolumes:
  - name: kafka-ca
    secret:
      secretName: kafka-ca
  - name: svid
    emptyDir: {}
extraVolumeMounts:
  - name: kafka-ca
    mountPath: /etc/kafka-ca
    readOnly: true
  - name: svid
    mountPath: /var/run/svid
    readOnly: true
initContainers:
  - name: fetch-assertion
    image: example.com/helper:1.0.0
    volumeMounts:
      - name: svid
        mountPath: /var/run/svid
  - name: renew-assertion
    image: example.com/helper:1.0.0
    restartPolicy: Always
    volumeMounts:
      - name: svid
        mountPath: /var/run/svid
extraContainers:
  - name: log-shipper
    image: example.com/shipper:1.0.0
nodeSelector:
  kubernetes.io/arch: amd64
tolerations:
  - key: dedicated
    operator: Exists
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
            - key: example.com/tier
              operator: In
              values: [tools]
config:
  server:
    listen: "0.0.0.0:9000"
  dex:
    upstream: http://dex.dex.svc.cluster.local:5556
  auth:
    issuer: https://kaas-ui.example.com/dex
    client_id: kaas-ui
    redirect_url: https://kaas-ui.example.com/auth/callback
    scopes: [openid, profile, email]
    connectors:
      - id: github
        name: GitHub
  roles:
    - name: admin
      subjects: ["someone@example.com"]
      clusters: ["*"]
      permissions:
        - resource: cluster_config
          actions: [all]
        - resource: topic
          actions: [all]
        - resource: connect
          actions: [all]
        - resource: connector
          actions: [all]
    - name: one-topic
      subjects: ["reader@example.com"]
      clusters: ["*"]
      permissions:
        - resource: topic
          value: "orders"
          actions: [view, messages_read]
  environments:
    - id: dev
      name: Development
      schema_registries:
        - id: registry
          name: registry
          url: https://registry.example.com/apis/ccompat/v7
          tls:
            ca_file: /etc/kafka-ca/ca.crt
      kafka_clusters:
        - id: kafka
          name: kafka
          bootstrap: ["kafka.example.com:9095"]
          labels:
            kind: example
          refresh_interval: 10s
          tls:
            ca_file: /etc/kafka-ca/ca.crt
          sasl:
            mechanism: scram-sha-512
            username: kaas-ui
          schema_registry: registry
      connect_clusters:
        - id: connect
          name: Kafka Connect
          url: http://connect.example.com:8083
          kafka_cluster: kafka
          writes:
            allow:
              - connector.restart
