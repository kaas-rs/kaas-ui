{{- if not .Values.existingConfigMap }}
{{- if not (dig "environments" nil (.Values.config | default dict)) }}
{{- fail "config.environments: declare at least one environment. kaas-ui refuses to start with an empty fleet, and every cluster lives inside one." }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (dig "auth" nil .Values.config) }}
{{- fail "replicaCount: more than one replica cannot serve `config.auth`. Sessions are encrypted with a key generated per process, so each pod would reject the others' cookies." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kaas-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaas-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kaas-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kaas-ui.podLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations (not .Values.existingConfigMap) }}
      annotations:
        {{- /*
        Every block but `environments`. kaas-ui swaps the fleet live and reads
        the rest once at startup, so this rolls the pod for exactly the edits
        that would otherwise look like nothing happening. Hashing the whole file
        would throw the live reload away.
        */}}
        {{- if not .Values.existingConfigMap }}
        checksum/startup-config: {{ omit (.Values.config | default dict) "environments" | toJson | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kaas-ui.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      # Not configurable. A Service named `kaas-ui` makes the kubelet inject
      # KAAS_UI_PORT and half a dozen others, under the prefix kaas-ui reads its
      # own configuration overlay and credentials from.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kaas-ui
          image: {{ include "kaas-ui.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/kaas-ui/config.yaml"]
          ports:
            - name: http
              containerPort: {{ include "kaas-ui.port" . }}
              protocol: TCP
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # The directory, never a subPath: a subPath mount does not see a
            # ConfigMap update, and the live reload depends on seeing one.
            - name: config
              mountPath: /etc/kaas-ui
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kaas-ui.configMapName" . }}
        # The root filesystem is read-only, so a scratch path has to be handed
        # over explicitly.
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
