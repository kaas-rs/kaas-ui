{{- if not .Values.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kaas-ui.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kaas-ui.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
{{- end }}
